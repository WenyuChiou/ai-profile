# Copy this file to .github/workflows/profile-refresh.yml in the profile repo.
#
# Operational facts:
# - Add AIPROFILE_IDENTITIES as a repository secret (JSON array or one email
#   per line). Identity emails never belong in the plain `with:` block.
# - A protected default branch can reject the GITHUB_TOKEN push. Either allow
#   the Actions bot to push the eight generated paths or use a PR flow manually.
# - GitHub disables scheduled workflows in public repositories after 60 days
#   without repository activity; workflow_dispatch is the manual re-arm path.
# - Use ONE caller per profile, never a matrix over profiles or repositories.
# - Settings > Actions must select "Allow all actions and reusable workflows"
#   or allowlist WenyuChiou/ai-profile/.github/workflows/profile-refresh.yml.
# - The 05:37 UTC schedule avoids top-of-hour load spikes, which GitHub may
#   delay or skip under heavy load.
name: Daily ai-profile refresh

on:
  schedule:
    - cron: '37 5 * * *'
  workflow_dispatch:

permissions: {}

# This caller-level group spans both refresh and Pages deployment. Its name is
# intentionally distinct from the nested reusable workflow's update-only group.
concurrency:
  group: profile-refresh-pages-${{ github.repository }}
  cancel-in-progress: false

jobs:
  refresh-profile:
    permissions:
      contents: write
    # Immutable commit 9c246d9 hardcodes ai-profile-cli==0.8.1 in the reusable
    # workflow; do not replace this full pin with a tag or branch.
    uses: WenyuChiou/ai-profile/.github/workflows/profile-refresh.yml@9c246d95052264c24e7175cabd295951c5236efc
    with:
      # public repositories only - the reusable workflow rejects anything else.
      repositories: |
        OWNER/REPOSITORY
        OWNER/ANOTHER-PUBLIC-REPOSITORY
    secrets:
      identities: ${{ secrets.AIPROFILE_IDENTITIES }}

  # This same-run deployment is required because commits pushed with GITHUB_TOKEN do not trigger
  # push-based workflow or Pages builds. The immutable published-sha output binds Pages to the
  # exact generated bundle, so an unrelated later push cannot substitute different bytes.
  deploy-pages:
    needs: refresh-profile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Validate immutable published revision
        env:
          PUBLISHED_SHA: ${{ needs.refresh-profile.outputs.published-sha }}
        run: |
          python - <<'PY'
          import os
          import re

          value = os.environ.get("PUBLISHED_SHA", "")
          if re.fullmatch(r"[0-9a-f]{40}", value) is None:
              raise SystemExit("published revision is invalid")
          PY
      - name: Check out exact published revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.refresh-profile.outputs.published-sha }}
          persist-credentials: false
      - name: Build exact Pages artifact
        run: |
          python - <<'PY'
          import shutil
          from pathlib import Path

          names = {
              "badge-dark.svg",
              "badge-light.svg",
              "dashboard.html",
              "heatmap-dark.svg",
              "heatmap-light.svg",
              "profile.json",
              "summary-dark.svg",
              "summary-light.svg",
          }
          source = Path("dist")
          destination = Path("_site")
          if not source.is_dir() or source.is_symlink():
              raise SystemExit("dist asset bundle is unavailable")
          entries = list(source.iterdir())
          if (
              {entry.name for entry in entries} != names
              or any(not entry.is_file() or entry.is_symlink() for entry in entries)
          ):
              raise SystemExit("unexpected dist asset set")
          if destination.exists() or destination.is_symlink():
              raise SystemExit("Pages staging directory already exists")
          try:
              target = destination / "dist"
              target.mkdir(parents=True)
              for name in sorted(names):
                  shutil.copyfile(source / name, target / name)
          except OSError:
              raise SystemExit("Pages artifact build failed") from None
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload exact Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
