[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-profile"
version = "0.1.0"
description = "Local-first, profile-level AI collaboration analytics for GitHub: aggregate explicit AI provenance across repositories into privacy-safe SVG/JSON README assets."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
keywords = ["git", "ai", "attribution", "provenance", "github-profile"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.scripts]
aiprofile = "aiprofile.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "hypothesis>=6"]

[tool.hatch.build.targets.wheel]
packages = ["src/aiprofile"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
