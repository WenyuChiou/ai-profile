[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "ai-profile-cli"
version = "0.4.4"
description = "Evidence-backed, privacy-safe AI collaboration cards and dashboards generated locally from explicit Git provenance."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
dependencies = []
keywords = ["git", "ai", "attribution", "provenance", "github-profile", "dashboard"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.urls]
Homepage = "https://github.com/WenyuChiou/ai-profile"
Repository = "https://github.com/WenyuChiou/ai-profile"
Issues = "https://github.com/WenyuChiou/ai-profile/issues"
Changelog = "https://github.com/WenyuChiou/ai-profile/blob/main/CHANGELOG.md"
Documentation = "https://github.com/WenyuChiou/ai-profile#readme"
Demo = "https://wenyuchiou.github.io/WenyuChiou/dist/dashboard.html"

[project.scripts]
aiprofile = "aiprofile.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "hypothesis>=6"]

[tool.hatch.build.targets.wheel]
packages = ["src/aiprofile"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
