# Manual-only GitHub Pages staging preview for the published v0.8.1 release.
# It reuses the unchanged Gate S contract from
# docs/reviews/promotion-eval-spec-v048.md. An unprivileged
# build job rebuilds the candidate wheel with the
# frozen SOURCE_DATE_EPOCH, verifies the exact pinned digest, installs that
# wheel into a fresh venv, renders the synthetic public-only dashboard, and
# transfers only the recursively verified two-file staging root. A separate
# least-privilege job deploys those already-verified bytes without checking
# out or executing project code. The browser matrix runs at
# https://wenyuchiou.github.io/ai-profile/v0.8.1/dashboard.html
# Guardrails are pinned by tests/unit/test_staging_preview.py: never
# triggered by push/pull_request/schedule, never from a fork, and no package
# installation shares a job with Pages/OIDC authority.
name: staging-preview

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: staging-preview-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify the v0.8.1 staging preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.repository == 'WenyuChiou/ai-profile' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 49e574b0ce80eef14cf38a20b654d03e9a50538c
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build and verify the exact pinned candidate wheel
        run: |
          python -m pip install build==1.4.3 twine==6.2.0
          SOURCE_DATE_EPOCH="$(python -c 'import json; print(json.load(open("docs/reviews/promotion-candidate.json", encoding="utf-8"))["source_date_epoch"])')"
          export SOURCE_DATE_EPOCH
          python -m build
          python -m twine check dist/*
          python scripts/check_release_artifacts.py \
            --dist-dir dist \
            --expected-version 0.8.1 \
            --expected-wheel-sha256 1faceac31ac7d9c3a99e3e4678bdfb725f73341e89e5847dc6a578ed8a6bbff9
      - name: Render the staging dashboard from the installed candidate wheel
        run: |
          STAGING_ROOT="$RUNNER_TEMP/aiprofile-staging"
          WHEEL="$(python -c 'from pathlib import Path; paths=list(Path("dist").glob("*.whl")); assert len(paths)==1, paths; print(paths[0])')"
          python -m venv "$RUNNER_TEMP/staging-venv"
          "$RUNNER_TEMP/staging-venv/bin/python" -m pip install "$WHEEL"
          "$RUNNER_TEMP/staging-venv/bin/python" scripts/render_staging_dashboard.py \
            --wheel "$WHEEL" \
            --out "$STAGING_ROOT/v0.8.1"
      - name: Verify the exact staging tree and pinned output digests
        run: |
          STAGING_ROOT="$RUNNER_TEMP/aiprofile-staging"
          export STAGING_ROOT
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["STAGING_ROOT"])
          assert root.is_dir() and not root.is_symlink()
          entries = sorted(
              (
                  path.relative_to(root).as_posix(),
                  "dir" if path.is_dir() else "file",
              )
              for path in root.rglob("*")
          )
          assert entries == [
              ("v0.8.1", "dir"),
              ("v0.8.1/dashboard.html", "file"),
              ("v0.8.1/staging-manifest.json", "file"),
          ], entries
          assert not any(path.is_symlink() for path in root.rglob("*"))
          staging = root / "v0.8.1"
          manifest = json.loads(
              (staging / "staging-manifest.json").read_text(encoding="utf-8")
          )
          assert set(manifest) == {
              "format_version",
              "package_version",
              "wheel_sha256",
              "dashboard_sha256",
              "fixture_id",
          }, manifest
          assert manifest["format_version"] == "aiprofile-staging-manifest/1", manifest
          assert manifest["fixture_id"] == "synthetic-two-provider-fixture-v3-provider-ledger", manifest
          assert manifest["package_version"] == "0.8.1", manifest
          assert manifest["wheel_sha256"] == (
              "1faceac31ac7d9c3a99e3e4678bdfb725f73341e89e5847dc6a578ed8a6bbff9"
          ), manifest
          digest = hashlib.sha256((staging / "dashboard.html").read_bytes()).hexdigest()
          assert manifest["dashboard_sha256"] == digest, (manifest, digest)
          assert digest == (
              "b9c7208ee1bece4a0a6cd39ea1b569a55ed30a78d14d85cdb74ee52b89b4cc48"
          ), digest
          canonical_manifest = (
              json.dumps(manifest, indent=2, sort_keys=True) + "\n"
          ).encode("utf-8")
          assert (staging / "staging-manifest.json").read_bytes() == canonical_manifest
          print("exact staging tree verified against pinned wheel and dashboard digests")
          PY
      - name: Transfer only the verified staging root
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-preview-${{ github.sha }}
          path: ${{ runner.temp }}/aiprofile-staging
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy the verified v0.8.1 staging preview
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository == 'WenyuChiou/ai-profile' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the verified staging root
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: staging-preview-${{ github.sha }}
          path: ${{ runner.temp }}/aiprofile-staging
      - name: Re-verify transferred bytes without executing project code
        run: |
          STAGING_ROOT="$RUNNER_TEMP/aiprofile-staging"
          export STAGING_ROOT
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["STAGING_ROOT"])
          assert root.is_dir() and not root.is_symlink()
          entries = sorted(
              (
                  path.relative_to(root).as_posix(),
                  "dir" if path.is_dir() else "file",
              )
              for path in root.rglob("*")
          )
          assert entries == [
              ("v0.8.1", "dir"),
              ("v0.8.1/dashboard.html", "file"),
              ("v0.8.1/staging-manifest.json", "file"),
          ], entries
          assert not any(path.is_symlink() for path in root.rglob("*"))
          staging = root / "v0.8.1"
          manifest = json.loads(
              (staging / "staging-manifest.json").read_text(encoding="utf-8")
          )
          assert set(manifest) == {
              "format_version",
              "package_version",
              "wheel_sha256",
              "dashboard_sha256",
              "fixture_id",
          }, manifest
          assert manifest["format_version"] == "aiprofile-staging-manifest/1", manifest
          assert manifest["fixture_id"] == "synthetic-two-provider-fixture-v3-provider-ledger", manifest
          assert manifest["package_version"] == "0.8.1", manifest
          assert manifest["wheel_sha256"] == (
              "1faceac31ac7d9c3a99e3e4678bdfb725f73341e89e5847dc6a578ed8a6bbff9"
          ), manifest
          digest = hashlib.sha256((staging / "dashboard.html").read_bytes()).hexdigest()
          assert manifest["dashboard_sha256"] == digest, (manifest, digest)
          assert digest == (
              "b9c7208ee1bece4a0a6cd39ea1b569a55ed30a78d14d85cdb74ee52b89b4cc48"
          ), digest
          canonical_manifest = (
              json.dumps(manifest, indent=2, sort_keys=True) + "\n"
          ).encode("utf-8")
          assert (staging / "staging-manifest.json").read_bytes() == canonical_manifest
          print("transferred staging bytes match the pinned release candidate")
          PY
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ runner.temp }}/aiprofile-staging
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
