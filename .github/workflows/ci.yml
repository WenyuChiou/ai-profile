# Continuous verification on every push/PR: the full suite + lint.
# This is the workflow behind the README's tests badge - the badge is
# only as honest as this file stays.
name: tests

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  candidate:
    name: Release candidate build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build and validate the shared candidate
        run: |
          python -m pip install build==1.4.3 twine==6.2.0
          python -m build
          python -m twine check dist/*
          EXPECTED_WHEEL_SHA256="$(python -c 'import json; print(json.load(open("docs/reviews/promotion-candidate.json", encoding="utf-8"))["wheel_sha256"])')"
          python scripts/check_release_artifacts.py \
            --dist-dir dist \
            --expected-wheel-sha256 "$EXPECTED_WHEEL_SHA256" \
            --write-checksums SHA256SUMS
      - name: Retain the exact candidate bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate-${{ github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Full suite + lint
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest tests -p no:cacheprovider
          python -m ruff check src tests scripts
          python scripts/check_readme_parity.py

  wheel-onboarding:
    name: Wheel onboarding (${{ matrix.os }} / Python 3.12)
    needs: candidate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Download the shared candidate bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate-${{ github.sha }}
          path: .
      - name: Clean-wheel onboarding smoke
        shell: bash
        run: |
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          python scripts/check_release_artifacts.py \
            --dist-dir dist \
            --artifact-only \
            --expected-version "$VERSION" \
            --checksum-file SHA256SUMS
          WHEEL="$(python -c 'from pathlib import Path; paths=list(Path("dist").glob("*.whl")); assert len(paths)==1, paths; print(paths[0])')"
          python scripts/release_smoke.py --wheel "$WHEEL" --expected-version "$VERSION"
